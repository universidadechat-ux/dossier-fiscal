<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Badge Accent -->
  <circle cx="410" cy="102" r="32" fill="url(#accentGrad)" />
  <path d="M400 102 L407 109 L422 94" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Typography / Letters EF -->
  <text x="256" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="160" fill="#ffffff" text-anchor="middle" letter-spacing="-6">EF</text>

  <!-- Fiscal / Ledger Lines -->
  <rect x="120" y="330" width="272" height="12" rx="6" fill="#38bdf8" fill-opacity="0.8" />
  <rect x="120" y="360" width="180" height="10" rx="5" fill="#94a3b8" fill-opacity="0.6" />
  <rect x="120" y="386" width="220" height="10" rx="5" fill="#94a3b8" fill-opacity="0.4" />
</svg>
